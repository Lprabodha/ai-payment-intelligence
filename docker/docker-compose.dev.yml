version: '3.8'

services:
  ai-payment-intelligence:
    build:
      context: .
      dockerfile: docker/Dockerfile
      cache_from:
        - ai-payment-intelligence:latest
      # Enable BuildKit for better caching
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ai-payment-intelligence:dev
    container_name: ai-payment-intelligence-dev
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/src
      # Mount model directory for persistence
      - ./src/data/models:/src/data/models
      # Mount raw data directory
      - ./src/data/raw:/src/data/raw
      # Mount logs directory
      - ./src/logs:/src/logs
      # Mount requirements for dependency changes
      - ./requirements.txt:/src/requirements.txt
    environment:
      - PYTHONPATH=/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    # Development overrides
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]

  # MongoDB for development
  mongodb:
    image: mongo:7.0
    container_name: ai-payment-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

volumes:
  mongodb_dev_data:
